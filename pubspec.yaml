name: flutter_run_tracker_app
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  font_awesome_flutter: ^11.0.0
  image_picker: ^1.2.4 # ใช้สำหรับการเลือกภาพจากการเปิดกล้อง
  supabase_flutter: ^2.18.3 # ใช้สำหรับการเชื่อมต่อกับ Supabase เพื่อ CRUD ข้อมูล


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/